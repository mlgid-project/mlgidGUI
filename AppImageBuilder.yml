version: 1

script:
  # Remove any previous build
  - rm -rf AppDir  | true
  # Make usr and icons dirs
  - mkdir -p AppDir/usr/src
  - mkdir -p AppDir/usr/share/icons/hicolor/256x256/apps/
  # Copy the python application code into the AppDir
  - cp ./main.py  AppDir/usr/src/
  - cp ./mlgidGUI/static/icons/window_icon_256.png AppDir/usr/share/icons/hicolor/256x256/apps/

  # Install mlgidGUI
  - python3.12 -m pip install --ignore-installed --prefix=/usr --root=AppDir ./

AppDir:

  path: ./AppDir

  app_info:
    id: org.appimage-crafters.python-appimage-example
    name: mlgidGUI
    icon: window_icon_256
    version: 0.1.0
    # Set the python executable as entry point
    exec: /usr/bin/python3.12
    # Set the application main script path as argument. Use '$@' to forward CLI parameters
    exec_args: "-s $APPDIR/usr/src/main.py"

  apt:
    arch: amd64
    sources:
      - sourceline: 'deb [arch=amd64] http://archive.ubuntu.com/ubuntu jammy main restricted universe multiverse'
        key_url: 'http://keyserver.ubuntu.com/pks/lookup?op=get&search=0x871920D1991BC93C'

      - sourceline: 'deb [arch=amd64] http://ppa.launchpad.net/deadsnakes/ppa/ubuntu jammy main'
        key_url: 'http://keyserver.ubuntu.com/pks/lookup?op=get&search=0x6A755776'

    include:
      - python3.12
      - python3-pkg-resources

    exclude: []

  runtime:
    env:
      # Set python home
      # See https://docs.python.org/3/using/cmdline.html#envvar-PYTHONHOME
      PYTHONHOME: '${APPDIR}/usr/'
      PATH: '${APPDIR}/usr/lib/python3.12/site-packages:${APPDIR}/usr/bin:${PATH}'
      # Path to the site-packages dir or other modules dirs
      # See https://docs.python.org/3/using/cmdline.html#envvar-PYTHONPATH
      PYTHONPATH: '${APPDIR}/usr/lib/python3.12/site-packages:${APPDIR}/usr/lib/python3.12:${APPDIR}/usr/bin'
      QT_DEBUG_PLUGINS: '1'

  test:
    arch:
      image: appimagecrafters/tests-env:archlinux-latest
      command: ./AppRun
      use_host_x: true

AppImage:
  update-information: 'gh-releases-zsync|AppImageCrafters|python-appimage-example|latest|python-appimage-*x86_64.AppImage.zsync'
  sign-key: None
  arch: x86_64