[build-system]
# setuptools >= 77 for PEP 639 license metadata (the SPDX `license`
# string + `license-files`).
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mlgidlab"
version = "0.1.0a21"
description = "mlgidLAB: graphical interface for the mlgidBASE GIWAXS analysis pipeline"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Nico Lerch", email = "nico.lerch@uni-tuebingen.de" },
]
keywords = ["GIWAXS", "GISAXS", "diffraction", "NeXus", "HDF5", "PySide6", "silx"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Visualization",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    # 6.12.0 drops one reference to None per void method call on Python
    # 3.11 (3.12+ makes None immortal, which hides it), so the process
    # aborts with "none_dealloc" after enough calls. Excluded on 3.11
    # only; later releases are allowed again.
    "PySide6>=6.6,!=6.12.0; python_version < '3.12'",
    "PySide6>=6.6; python_version >= '3.12'",
    # silx[full] pulls in matplotlib, dateutil, qtawesome, PyOpenGL — all
    # required by DataViewerFrame's auto-rendering.
    "silx[full]>=2.1",
    "h5py>=3.10",
    "numpy>=1.24",
    "scipy>=1.10",
    "pyqtgraph>=0.13",
    "qdarkstyle>=3.2",
    # In-GUI PONI calibration + mask creation: the Conversion dock's
    # "Create…" buttons embed pyFAI's calibration widget set (the same
    # workflow as the standalone pyFAI-calib2 CLI). Imported lazily
    # inside the button handlers so a broken pyFAI install doesn't
    # block cold startup.
    "pyFAI>=2024.1",
    # Reading standalone detector images (TIFF/CBF/EDF) in raw mode. Already
    # present transitively via silx[full]/pyFAI; pinned here so the image
    # open path has an explicit floor.
    "fabio>=2024.1",
]

[project.optional-dependencies]
# pytest-qt drives the GUI smoke harness; tests run headless via
# QT_QPA_PLATFORM=offscreen set in tests/conftest.py (no xvfb needed).
# pytest-xdist parallelizes the suite across CPU cores for LOCAL runs
# (``-n auto --dist loadfile``; loadfile keeps each test file on one
# worker, matching the suite's per-file fixture assumptions). CI
# deliberately does not use it — it hung on the hosted runners — and
# fans out by sharding test files across matrix jobs instead (see
# .github/workflows/ci.yml).
dev = ["pytest>=8.0", "pytest-qt>=4.4", "pytest-xdist>=3.5"]
# Pipeline backend (heavy: pulls torch + the mlgid analysis stack).
# Install when you actually want to run detection/fitting/matching from
# the GUI. The GUI imports mlgidbase, pygid, pygidfit, mlgidmatch and
# pygidsim *directly*, so all five are declared here rather than relying
# on mlgidbase's transitive closure — a future mlgidbase that drops one
# then surfaces as a clear resolver error, not a runtime ImportError.
# mlgiddetect is declared for the same reason as the rest: since the
# detection-model pre-flight (mlgidlab/detection_model.py) reads its
# MODEL_URLS table and cache directory, the GUI now imports it directly.
# Exact ('==') pins, not floors: each in-house backend release can shift
# the detection/fitting/matching numerics or the on-disk schema, so a
# bump must be a deliberate, test-rechecked change rather than something
# pip silently picks up. The versions below are the verified-good set
# (all tests pass against them — see docs/backend_compatibility.md).
# To move up: bump here, re-run the full suite + the end-to-end demo
# loop, then commit the new pins.
pipeline = [
    # The 0.1.11 stack (2026-10-22): mlgidbase pins mlgiddetect==0.2.8
    # and mlgidmatch==0.1.3 itself, and takes pygid (>=0.2.20) and
    # pygidfit (>=0.1.8) on floors; the explicit exact repeats below
    # exist because the GUI imports those packages directly (see
    # comment above), and pygid/pygidfit are pinned exact here so those
    # floors cannot drift under us. The GPU detection runtime needs
    # no pin here anymore: mlgiddetect >= 0.2.7 carries its own
    # per-Python onnxruntime-gpu pins (CUDA 12 builds; 1.26.0 on
    # Python 3.11+) and gates GPU use on the ORT providers natively.
    #
    # What the 0.1.11 / 0.1.8 / 0.2.20 set changes for the GUI (full
    # list in docs/backend_compatibility.md, 2026-10-22 entry):
    # pygidfit 0.1.8 carries the polar-grid N-1 fix, copies detected
    # ids onto fitted rows and masks hot pixels per ROI; mlgidbase
    # 0.1.11 stores fitted ids (not row positions) in matched
    # ``peak_list``, no longer renumbers ids on delete, and replaced
    # ``track_peaks(axis=, plot_params=)`` with a version that saves a
    # ``tracked_peaks`` table into the file.
    #
    # pygidsim 0.1.4 -> 0.1.7 (2026-10-06): the q-range mask in
    # ``GIWAXS.giwaxs_2d`` compared q_z against the q_xy upper limit
    # after mirroring, so the q_xy ceiling was never enforced and
    # spurious high-q_xy reflections survived into every simulated 2D
    # pattern. That feeds mlgidmatch's CifPattern, hence the GUI's
    # Expected-pattern overlay and its matching candidates. 0.1.7
    # resolves against the rest of this set unchanged (mlgidmatch and
    # pygid both take pygidsim on a floor).
    "mlgidbase==0.1.11",
    "mlgiddetect==0.2.8",
    "pygid==0.2.20",
    "pygidfit==0.1.8",
    "mlgidmatch==0.1.3",
    "pygidsim==0.1.7",
    "networkx",
    "PyYAML",
]

[project.gui-scripts]
mlgidlab = "mlgidlab:main"

[project.urls]
Homepage = "https://github.com/mlgid-project/mlgidLAB"
Repository = "https://github.com/mlgid-project/mlgidLAB"
Issues = "https://github.com/mlgid-project/mlgidLAB/issues"

[tool.pytest.ini_options]
testpaths = ["tests"]
# Quiet, fail-fast-ish defaults for the smoke harness.
addopts = "-q -ra"
markers = [
    "gui: constructs a MainWindow/QWidget — needs the offscreen QApplication",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["mlgidlab*"]

# `packages.find` finds packages, it does not ship data files. Without
# this stanza the SVG glyphs are missing from the wheel and every icon
# silently falls back to nothing — tests/test_icons.py checks the assets
# are importable so a broken wheel fails CI rather than a user's install.
[tool.setuptools.package-data]
mlgidlab = ["assets/icons/*.svg", "assets/app/*.png", "assets/app/*.ico"]
