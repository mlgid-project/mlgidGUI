# Stabilisation sprint, workstream D: run the pytest-qt smoke harness
# headless on every push / PR so the regression net defends itself.
#
# The harness is headless (QT_QPA_PLATFORM=offscreen) and hermetic
# (tests/conftest.py redirects XDG_CONFIG_HOME), so no display / xvfb
# is needed. conftest.py already sets the offscreen platform via
# os.environ.setdefault; it is also set here so the intent is visible
# at the CI level and an explicit override would still win.
#
# Only the base + dev dependencies are installed. The heavy `pipeline`
# extra (torch + mlgidbase) is deliberately omitted: the smoke suite
# verified that open / frame / save / close never import it.

name: CI

on:
  push:
  pull_request:
  # Manual escape hatch: GitHub Actions incidents can swallow push
  # events entirely (observed 2026-08-06 — a pushed commit produced no
  # run at all). workflow_dispatch lets `gh workflow run ci.yml
  # --ref <branch>` start CI for the branch head by hand.
  workflow_dispatch:

# A newer push supersedes any still-running CI for the same ref —
# without this, runs pile up (and a hung run blocks nothing but
# wastes six hours of runner time until the job timeout).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: smoke harness (py${{ matrix.python-version }}, shard ${{ matrix.shard }})
    runs-on: ubuntu-latest
    # The suite shard takes ~7 min; anything near this limit is a hang
    # (observed once with in-job pytest-xdist), not a slow run.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # 3.11 is the requires-python floor; 3.12 is the dev/runtime
        # environment the suite was validated against; 3.13 and 3.14
        # are forward-compat. fail-fast is false, so if a newer Python
        # fails only because an upstream dep (PySide6 / pyFAI / silx /
        # scipy / h5py) has no wheel for it yet, the older jobs still
        # report.
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        # Wall-clock parallelism comes from sharding the test FILES
        # across jobs, not from in-job pytest-xdist workers: xdist ran
        # the suite fine locally but hung on the hosted runners (the
        # conftest ``os._exit`` teardown guard assumes a plain
        # short-lived pytest process, and worker shutdown races are
        # exactly where that assumption bends). Each shard is the
        # ordinary serial suite over a deterministic third of the
        # files, so every test still runs on every Python and the
        # teardown guard keeps its contract.
        shard: [0, 1, 2]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # PySide6's offscreen platform plugin still links the Qt GUI
      # libraries, so a few system libs are required even with no
      # display. pip wheels bundle the rest of Qt.
      - name: Install headless Qt system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libglib2.0-0 libxkbcommon0 \
            libxcb-cursor0 libdbus-1-3 libfontconfig1

      - name: Install package (base + dev extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run smoke harness (shard ${{ matrix.shard }} of 3)
        env:
          QT_QPA_PLATFORM: offscreen
        # ``-v`` so each test name flushes to stdout *before* it runs;
        # without it a mid-test segfault dumps a C stack but the
        # Python-side test name never reaches the log, so we can't
        # tell which test crashed. ``-rA`` also prints the per-test
        # summary at the end (passed / skipped / failed names) for
        # quick triage when one Python version diverges from another.
        # The shard is every third test file (sorted, round-robin), so
        # the three shards partition the suite exactly; conftest.py is
        # picked up as usual.
        #
        # ``LC_ALL=C`` on the listing, because ``ls`` sorts by locale and
        # the partition is positional: under C, ``_`` (0x5F) orders
        # before the lowercase letters, while en_US.UTF-8 collation
        # ignores it at the primary level. The two disagree on enough
        # neighbours (``test_flow_layout.py`` vs
        # ``test_flow_layout_collapse.py``, ``test_viewer_controls.py``
        # vs ``test_viewer_released_frame_source.py``) to put a file in
        # a different shard, so without this a failing shard cannot be
        # reproduced locally without matching the runner's locale.
        run: |
          mapfile -t FILES < <(LC_ALL=C ls tests/test_*.py | awk "NR % 3 == ${{ matrix.shard }}")
          pytest -v -rA "${FILES[@]}"

  # Windows-only regression net for the paths that genuinely differ per
  # OS: the self-update launcher rename (a running Scripts\mlgidgui.exe
  # is locked on Windows -> WinError 32 without it) and the detection
  # model pre-flight (pythonw console handling). Targeted files only —
  # the full GUI suite is covered by the Linux shards above; running it
  # on a Windows runner is unproven and slow.
  windows:
    name: windows update/model tests (py3.12)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # No system-library step: on Windows the PySide6 wheels bundle
      # everything the offscreen platform plugin needs.
      - name: Install package (base + dev extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Windows-relevant tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest -v -rA tests/test_update_check.py tests/test_detection_model.py
