# Prove that the BUILT wheel installs into a clean Python and starts.
#
# ci.yml installs the source tree editable and runs the tests, so it cannot
# notice a data file missing from the wheel, a dependency missing from the
# metadata, or an import that only works from a checkout. This workflow builds
# the wheel, leaves the checkout, installs the wheel the way a user would, and
# runs ``mlgidgui --self-test`` (a real window on the offscreen platform, the
# bundled changelog and icons) through the module and through the installed
# launcher.
#
#   base      the wheel alone, Linux and Windows, Python 3.11 to 3.14
#   pipeline  the wheel with the [pipeline] extra (torch and the mlgid
#             backends), Linux, Python 3.11 to 3.14, self-test with
#             --backends (imports, a 2D fit, a CIF read, a torchvision call)
#
# A Python version that one of the backends does not support yet shows up as
# a red cell in the pipeline matrix and does not stop the others.
#
# Runs on the 1.0.0 branch, on version tags and on demand; it is separate from
# ci.yml so the pipeline cells (several gigabytes each) do not run on every
# push to every branch.

name: Install check

on:
  push:
    branches: [dev/v1.0.0]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: install-check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  wheel:
    name: build the wheel
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Build the wheel
        run: |
          python -m pip install build
          python -m build --wheel

      - name: Store the wheel
        uses: actions/upload-artifact@v7
        with:
          name: wheel
          path: dist/*.whl
          if-no-files-found: error

  install:
    name: ${{ matrix.extra && 'pipeline' || 'base' }} (${{ matrix.os }}, py${{ matrix.python-version }})
    needs: wheel
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.extra && 60 || 20 }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        extra: [false]
        include:
          - os: ubuntu-latest
            python-version: "3.11"
            extra: true
          - os: ubuntu-latest
            python-version: "3.12"
            extra: true
          - os: ubuntu-latest
            python-version: "3.13"
            extra: true
          - os: ubuntu-latest
            python-version: "3.14"
            extra: true
    defaults:
      run:
        shell: bash
    env:
      PYTHONUTF8: "1"
      QT_QPA_PLATFORM: offscreen
    steps:
      # No checkout: the job must not be able to import the source tree.
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      # PySide6's offscreen platform plugin still links the Qt GUI libraries
      # on Linux (same list as ci.yml); the Windows wheels bundle them.
      - name: Install headless Qt system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libglib2.0-0 libxkbcommon0 \
            libxcb-cursor0 libdbus-1-3 libfontconfig1

      - name: Fetch the wheel
        uses: actions/download-artifact@v8
        with:
          name: wheel
          path: wheel

      - name: Install the wheel${{ matrix.extra && ' with the pipeline extra' || '' }}
        env:
          EXTRA: ${{ matrix.extra && '[pipeline]' || '' }}
        run: |
          python -m pip install --upgrade pip
          python -m pip install "$(ls wheel/*.whl)$EXTRA"
          python -m pip list
          python -m pip check

      # Both checks run outside the checkout (there is none) and look at what
      # got installed: the package comes from site-packages, carries the
      # version, exposes one launcher, and the old package name is gone (D4).
      - name: Inspect the installation
        run: |
          python - <<'PY'
          import importlib
          import importlib.metadata as md
          from pathlib import Path

          import mlgidgui

          location = Path(mlgidgui.__file__).resolve()
          assert "site-packages" in location.parts, location
          print("mlgidgui", mlgidgui.__version__, "from", location.parent)
          assert md.version("mlgidgui") == mlgidgui.__version__
          launchers = sorted(
              e.name for e in md.entry_points(group="gui_scripts")
              if e.value.startswith("mlgidgui"))
          assert launchers == ["mlgidgui"], launchers
          for old in ("mlgidlab", "mlgidbase_gui"):
              try:
                  importlib.import_module(old)
              except ModuleNotFoundError:
                  continue
              raise SystemExit(f"{old} must not be importable")
          print("launcher:", launchers, "- the old package names are gone")
          PY

      - name: Self-test through the module
        env:
          MLGIDGUI_SELFTEST_LOG: ${{ runner.temp }}/selftest-module.log
          BACKENDS: ${{ matrix.extra && '--backends' || '' }}
        run: |
          rc=0
          python -m mlgidgui --self-test $BACKENDS || rc=$?
          [ -f "$MLGIDGUI_SELFTEST_LOG" ] && cat "$MLGIDGUI_SELFTEST_LOG"
          exit $rc

      # The installed launcher is a GUI script (no console on Windows), so it
      # is started from Python, which waits for it on every platform.
      - name: Self-test through the installed launcher
        env:
          MLGIDGUI_SELFTEST_LOG: ${{ runner.temp }}/selftest-launcher.log
          BACKENDS: ${{ matrix.extra && '--backends' || '' }}
        run: |
          rc=0
          python - $BACKENDS <<'PY' || rc=$?
          import shutil
          import subprocess
          import sys

          exe = shutil.which("mlgidgui")
          assert exe, "the mlgidgui launcher is not on PATH"
          print("launcher:", exe)
          sys.exit(subprocess.run([exe, "--self-test", *sys.argv[1:]]).returncode)
          PY
          [ -f "$MLGIDGUI_SELFTEST_LOG" ] && cat "$MLGIDGUI_SELFTEST_LOG"
          exit $rc
